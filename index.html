<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0d1b">
<title>Happy Birthday, Elozino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --wine-950: #230a15;
    --wine-900: #2e0f1d;
    --wine-800: #3e1426;
    --wine-700: #521b30;
    --gold: #dfc08c;
    --gold-deep: #b98f57;
    --cream: #f6e7d1;
    --blush: #d9b9ab;
    --btn: #e8cfa6;
    --btn-ink: #3a1223;
    --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --clip-w: clamp(200px, 56vw, 236px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    color: var(--cream);
    font-family: var(--sans);
    background: var(--wine-900);
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; height: 100svh; }

  /* ---------- shared backdrop (the frame + edge shading from the reference) ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, #5a2037 0%, rgba(90,32,55,0) 70%),
      linear-gradient(180deg, var(--wine-800) 0%, var(--wine-900) 55%, var(--wine-950) 100%);
  }
  .frame {
    position: fixed; inset: 14px; z-index: 0; pointer-events: none;
    border: 1px solid rgba(223,192,140,.17);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(20,5,12,.55) 100%);
  }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  /* ================= PAGE 1 ================= */
  #page1 {
    position: relative; z-index: 2;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 28px 48px;
    text-align: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  #page1.leaving { opacity: 0; transform: translateY(-18px) scale(.985); pointer-events: none; }

  .arch, .arch-inner {
    position: absolute; left: 50%; transform: translateX(-50%);
    border: 1px solid rgba(223,192,140,.15);
    border-bottom: 0;
    border-radius: 999px 999px 0 0;
    pointer-events: none;
  }
  .arch { top: 7svh; bottom: 0; width: min(88vw, 440px); }
  .arch-inner { top: calc(7svh + 16px); bottom: 0; width: min(calc(88vw - 36px), 404px); border-color: rgba(223,192,140,.1); }
  .spine {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(223,192,140,.2) 25%, rgba(223,192,140,.2) 75%, transparent);
    pointer-events: none;
  }

  .spark { position: absolute; color: var(--gold-deep); opacity: .75; animation: twinkle 4.5s ease-in-out infinite; }
  .spark svg { display: block; }
  .spark.s1 { left: 26px; top: 33svh; width: 28px; }
  .spark.s2 { right: 34px; bottom: 11svh; width: 22px; animation-delay: 2s; }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.9);} 50% { opacity: .9; transform: scale(1.05);} }

  .content { position: relative; display: flex; flex-direction: column; align-items: center; max-width: 380px; }

  .medallion {
    width: 58px; height: 58px; border-radius: 50%;
    border: 1px solid rgba(223,192,140,.5);
    box-shadow: 0 0 0 7px rgba(223,192,140,.05), 0 0 40px rgba(223,192,140,.1);
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 1.7rem; color: var(--gold); font-weight: 400;
  }
  .when {
    margin: 30px 0 0;
    font-size: .74rem; letter-spacing: .34em; text-transform: uppercase;
    color: var(--blush); padding-left: .34em;
  }
  h1 {
    margin: 14px 0 0;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(3.3rem, 16vw, 5.4rem);
    line-height: .94; letter-spacing: -.01em;
    color: var(--cream);
  }
  h1 em { display: block; font-style: italic; color: var(--gold); font-weight: 400; margin-top: .04em; }
  .rule { width: 84px; height: 1px; background: rgba(223,192,140,.55); margin: 34px 0 26px; }
  .lede {
    margin: 0 0 34px;
    font-size: 1.02rem; line-height: 1.85; color: var(--blush);
    max-width: 26ch;
  }

  .open-btn {
    appearance: none; -webkit-appearance: none; cursor: pointer;
    background: transparent;
    border: 2px solid #f0dbb2; border-radius: 999px;
    padding: 5px;
    transition: transform .25s ease, box-shadow .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .open-btn span.inner {
    display: flex; align-items: center; gap: 14px;
    background: var(--btn); color: var(--btn-ink);
    border-radius: 999px;
    padding: 19px 30px;
    font-weight: 500; font-size: 1.05rem; letter-spacing: .005em;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .open-btn svg { flex: none; }
  .open-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(232,207,166,.22); }
  .open-btn:active { transform: scale(.98); }
  .open-btn .arrow { transition: transform .25s ease; }
  .open-btn:hover .arrow { transform: translateX(4px); }

  /* one orchestrated entrance on load */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .rise.d1 { animation-delay: .15s; } .rise.d2 { animation-delay: .35s; } .rise.d3 { animation-delay: .6s; }
  .rise.d4 { animation-delay: .85s; } .rise.d5 { animation-delay: 1.05s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ================= PAGE 2 ================= */
  #page2 {
    position: relative; z-index: 2;
    display: none; opacity: 0;
    padding: 64px 0 90px;
    transition: opacity 1s ease;
  }
  #page2.show { display: block; }
  #page2.in { opacity: 1; }

  .head { text-align: center; padding: 0 28px; }
  .head .medallion { margin: 0 auto; width: 50px; height: 50px; font-size: 1.5rem; }
  .head .when { margin-top: 24px; }
  .head h2 {
    margin: 12px 0 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(2.6rem, 12vw, 4rem); line-height: 1; color: var(--cream);
  }
  .head h2 em { display: block; font-style: italic; color: var(--gold); }

  .letter {
    position: relative;
    width: min(100% - 48px, 560px);
    margin: 38px auto 0;
    padding: 34px 26px 32px;
    border: 1px solid rgba(223,192,140,.26);
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    box-shadow: 0 24px 60px rgba(10,2,6,.35), inset 0 0 0 6px rgba(223,192,140,.03);
    cursor: default;
  }
  .letter p {
    margin: 0 0 1.05em;
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(1.28rem, 5.2vw, 1.5rem); line-height: 1.55;
    color: var(--cream);
  }
  .letter p:last-child { margin-bottom: 0; }
  .letter p.greet { font-style: italic; color: var(--gold); font-size: clamp(1.45rem, 6vw, 1.75rem); }
  .letter .todo { visibility: hidden; }
  .caret {
    display: inline-block; width: 2px; height: 1.05em; margin: 0 1px -.18em;
    background: var(--gold); animation: blink 1s steps(1) infinite;
  }
  .caret[hidden] { display: none; }
  .letter.done .caret { display: none; }
  @keyframes blink { 50% { opacity: 0; } }

  .reel { margin-top: 64px; }
  .reel-title {
    text-align: center; margin: 0 0 6px; padding: 0 28px;
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(1.9rem, 8vw, 2.5rem); color: var(--gold);
  }
  .reel-hint { text-align: center; margin: 0 0 22px; font-size: .86rem; color: var(--blush); opacity: .85; }
  .track {
    display: flex; gap: 18px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 8px calc((100vw - var(--clip-w)) / 2) 18px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }
  .clip {
    --r: calc(var(--clip-w) / 2);
    flex: none; width: var(--clip-w); margin: 0;
    scroll-snap-align: center;
    padding: 6px;
    border: 1px solid rgba(223,192,140,.45);
    border-radius: var(--r) var(--r) 22px 22px;
    background: rgba(20,5,12,.35);
    box-shadow: 0 18px 44px rgba(10,2,6,.45);
  }
  .clip video {
    display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
    background: #1a060e;
    border-radius: calc(var(--r) - 6px) calc(var(--r) - 6px) 17px 17px;
  }
  @media (min-width: 980px) {
    .track { justify-content: center; overflow: visible; padding-inline: 24px; scroll-snap-type: none; }
    .clip { --clip-w-d: 224px; }
    :root { --clip-w: 224px; }
  }

  .sign { text-align: center; margin-top: 56px; padding: 0 28px; }
  .sign .rule { margin: 0 auto 26px; }
  .sign-text {
    margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(2.6rem, 12vw, 3.6rem); color: var(--gold); line-height: 1.1;
    min-height: 1.1em;
  }
  .sign-text .todo { visibility: hidden; }
  .sign-text .caret { height: .8em; margin-bottom: -.05em; }
  .sign.done .caret { display: none; }

  /* ---------- floating cakes ---------- */
  .cakes { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; display: none; }
  body.p2 .cakes { display: block; }
  .cake {
    position: absolute; bottom: -50px; opacity: 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
    animation: floatUp linear infinite;
    will-change: transform, opacity;
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) rotate(-8deg); opacity: 0; }
    10%  { opacity: .55; }
    50%  { transform: translate3d(var(--sway), -55vh, 0) rotate(8deg); }
    90%  { opacity: .5; }
    100% { transform: translate3d(calc(var(--sway) * -.6), -115vh, 0) rotate(-6deg); opacity: 0; }
  }

  /* ---------- music toggle ---------- */
  .sound {
    position: fixed; z-index: 5; top: 26px; right: 28px;
    width: 42px; height: 42px; border-radius: 50%;
    display: none; place-items: center; cursor: pointer;
    background: rgba(46,15,29,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(223,192,140,.45); color: var(--gold);
    -webkit-tap-highlight-color: transparent;
  }
  body.p2 .sound { display: grid; }
  .sound .slash { display: none; }
  .sound.off .slash { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
    .spark, .caret { animation: none; }
    .cakes { display: none !important; }
    #page1, #page2 { transition: none; }
  }
</style>
</head>
<body class="locked">

<div class="bg"></div>
<div class="frame"></div>
<div class="vignette"></div>
<div class="cakes" id="cakes" aria-hidden="true"></div>

<button class="sound" id="sound" aria-label="Turn music off" title="Music">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
    <path class="slash" d="M3 3l18 18"/>
  </svg>
</button>

<!-- ========== PAGE 1 ========== -->
<section id="page1" aria-label="Welcome">
  <div class="arch"></div><div class="arch-inner"></div><div class="spine"></div>
  <span class="spark s1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M12 1.5c.8 5.6 4.9 9.7 10.5 10.5-5.6.8-9.7 4.9-10.5 10.5C11.2 16.9 7.1 12.8 1.5 12 7.1 11.2 11.2 7.1 12 1.5z"/></svg></span>
  <span class="spark s2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M12 1.5c.8 5.6 4.9 9.7 10.5 10.5-5.6.8-9.7 4.9-10.5 10.5C11.2 16.9 7.1 12.8 1.5 12 7.1 11.2 11.2 7.1 12 1.5z"/></svg></span>

  <div class="content">
    <div class="medallion rise d1" aria-hidden="true">E</div>
    <p class="when rise d2">October 30th</p>
    <h1 class="rise d3">Happy<br>birthday<em>my big head</em></h1>
    <div class="rule rise d4"></div>
    <p class="lede rise d4">Elozino, there is a card waiting for you. Turn the music on and open it.</p>
    <button class="open-btn rise d5" id="openBtn" type="button">
      <span class="inner">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6.5L20.5 7"/>
        </svg>
        <span>Open birthday card</span>
        <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </span>
    </button>
  </div>
</section>

<!-- ========== PAGE 2 ========== -->
<main id="page2" aria-label="Birthday card">
  <header class="head">
    <div class="medallion" aria-hidden="true">E</div>
    <p class="when">October 30th</p>
    <h2>Happy birthday,<em>Elozino</em></h2>
  </header>

  <section class="letter" id="letter" aria-live="polite" title="Tap to show the full message"></section>

  <section class="reel" aria-label="Videos">
    <h3 class="reel-title">A few moments of you</h3>
    <p class="reel-hint">Tap to play. Swipe for more. The song pauses while a video plays.</p>
    <div class="track" id="track">
      <figure class="clip"><video src="moment-1.mp4" preload="metadata" playsinline controls controlslist="nodownload"></video></figure>
      <figure class="clip"><video src="moment-2.mp4" preload="metadata" playsinline controls controlslist="nodownload"></video></figure>
      <figure class="clip"><video src="moment-3.mp4" preload="metadata" playsinline controls controlslist="nodownload"></video></figure>
      <figure class="clip"><video src="moment-4.mp4" preload="metadata" playsinline controls controlslist="nodownload"></video></figure>
    </div>
  </section>

  <footer class="sign" id="sign">
    <div class="rule"></div>
    <p class="sign-text" id="signText" aria-label="Bolu cares"></p>
  </footer>
</main>

<script>
(() => {
  /* =====================================================
     EDIT HERE: the message that types out on page 2.
     Each line is one paragraph. The first one is the greeting.
     ===================================================== */
  const MESSAGE = [
    "Elozino,",
    "Happy birthday. Today the whole world gets to celebrate one of its finest, and I'm so glad I get to say it to you.",
    "May your health stay strong, your days stay light, and your heart stay at peace.",
    "May your account smile every time you check it, with more money than you can count and more on the way.",
    "And never forget how beautiful you are. Not only the face that makes people pause, but the way you carry yourself, the way you laugh, and the way you light up every room you walk into.",
    "Enjoy your day. You deserve every bit of it."
  ];
  const SIGN_OFF = "Bolu cares";

  const $ = (s) => document.querySelector(s);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- MUSIC ----------------
     Plays music/birthday.mp3 if you add that file.
     Otherwise it plays a built-in music-box "Happy Birthday". */
  const music = (() => {
    let mode = null, audio = null, ctx = null, master = null, echo = null;
    let timer = null, nextAt = 0, paused = false;
    const B = 0.62;                                   // seconds per beat
    const N = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
    const TUNE = [
      ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
      ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
      ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],
      ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]
    ];

    function unlock() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!ctx && AC) ctx = new AC();
      if (ctx && ctx.state === 'suspended') ctx.resume();
    }

    function note(freq, t, d) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0008, t + d * 1.7);
      const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
      const o2 = ctx.createOscillator(); o2.type = 'sine';     o2.frequency.value = freq * 2;
      const g2 = ctx.createGain(); g2.gain.value = 0.22;
      o1.connect(g); o2.connect(g2); g2.connect(g);
      g.connect(master); g.connect(echo);
      o1.start(t); o2.start(t);
      o1.stop(t + d * 1.7 + 0.1); o2.stop(t + d * 1.7 + 0.1);
    }

    function schedule() {
      let t = nextAt;
      for (const [n, beats] of TUNE) { note(N[n], t, beats * B); t += beats * B; }
      nextAt = t + 1.8;
    }

    function startSynth() {
      if (mode === 'synth' || !ctx) return;
      mode = 'synth';
      master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      echo = ctx.createDelay(1); echo.delayTime.value = 0.27;
      const fb = ctx.createGain(); fb.gain.value = 0.32;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      echo.connect(lp); lp.connect(fb); fb.connect(echo); lp.connect(master);
      nextAt = ctx.currentTime + 0.2;
      schedule();
      timer = setInterval(() => { if (ctx.currentTime > nextAt - 2) schedule(); }, 400);
      master.gain.setTargetAtTime(0.5, ctx.currentTime, 0.3);
    }

    return {
      start() {
        unlock();
        audio = new Audio('music/birthday.mp3');
        audio.loop = true; audio.volume = 0.75;
        audio.addEventListener('error', startSynth);
        const p = audio.play();
        if (p && p.then) p.then(() => { if (mode !== 'synth') mode = 'file'; }).catch(startSynth);
      },
      pause() {
        paused = true;
        if (mode === 'file') audio.pause();
        else if (mode === 'synth') {
          master.gain.setTargetAtTime(0, ctx.currentTime, 0.12);
          setTimeout(() => { if (paused) ctx.suspend(); }, 600);
        }
      },
      resume() {
        paused = false;
        if (mode === 'file') audio.play().catch(() => {});
        else if (mode === 'synth') {
          ctx.resume();
          master.gain.setTargetAtTime(0.5, ctx.currentTime, 0.2);
        }
      }
    };
  })();

  /* ---------------- OPEN THE CARD (page 1 -> page 2) ---------------- */
  const page1 = $('#page1'), page2 = $('#page2');
  let opened = false;

  $('#openBtn').addEventListener('click', () => {
    if (opened) return;
    opened = true;
    music.start();                                    // must start inside the tap
    page1.classList.add('leaving');
    setTimeout(() => {
      page1.style.display = 'none';
      document.body.classList.remove('locked');
      document.body.classList.add('p2');
      page2.classList.add('show');
      window.scrollTo(0, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => page2.classList.add('in')));
      makeCakes();
      setTimeout(typeLetter, 900);
    }, 800);
  });

  /* ---------------- TYPING ----------------
     The full text is laid out up front (hidden), so nothing jumps while it types. */
  const letter = $('#letter');
  let skip = false, letterDone = false;

  letter.addEventListener('click', () => { skip = true; });

  function typeDelay(ch) {
    if (skip) return 0;
    if (ch === '.') return 420;
    if (ch === ',') return 200;
    return 26 + Math.random() * 22;
  }

  async function typeLetter() {
    const rows = MESSAGE.map((txt, i) => {
      const p = document.createElement('p');
      if (i === 0) p.className = 'greet';
      const done = document.createTextNode('');
      const caret = document.createElement('span'); caret.className = 'caret'; caret.hidden = true;
      const todo = document.createElement('span'); todo.className = 'todo'; todo.textContent = txt;
      p.append(done, caret, todo);
      letter.appendChild(p);
      return { txt, done, caret, todo };
    });
    for (const r of rows) {
      r.caret.hidden = false;
      for (let i = 0; i < r.txt.length; i++) {
        r.done.data = r.txt.slice(0, i + 1);
        r.todo.textContent = r.txt.slice(i + 1);
        const d = typeDelay(r.txt[i]);
        if (d) await sleep(d);
      }
      r.caret.hidden = true;
      if (!skip) await sleep(380);
    }
    letter.classList.add('done');
    letterDone = true;
    maybeSign();
  }

  /* ---------------- SIGN-OFF: "Bolu cares" ---------------- */
  const sign = $('#sign'), signText = $('#signText');
  let signSeen = false, signStarted = false;

  new IntersectionObserver((es) => {
    if (es.some(e => e.isIntersecting)) { signSeen = true; maybeSign(); }
  }, { threshold: 0.8 }).observe(signText);

  async function maybeSign() {
    if (signStarted || !signSeen || !letterDone) return;
    signStarted = true;
    const done = document.createTextNode('');
    const caret = document.createElement('span'); caret.className = 'caret';
    const todo = document.createElement('span'); todo.className = 'todo'; todo.textContent = SIGN_OFF;
    signText.append(done, caret, todo);
    for (let i = 0; i < SIGN_OFF.length; i++) {
      done.data = SIGN_OFF.slice(0, i + 1);
      todo.textContent = SIGN_OFF.slice(i + 1);
      await sleep(130);
    }
    await sleep(900);
    sign.classList.add('done');
  }

  /* ---------------- VIDEOS: pause the song while one plays ---------------- */
  const vids = [...document.querySelectorAll('video')];
  let muted = false;
  vids.forEach(v => {
    v.addEventListener('play', () => {
      vids.forEach(o => { if (o !== v) o.pause(); });
      music.pause();
    });
    const back = () => {
      if (vids.some(x => !x.paused && !x.ended)) return;
      if (!muted) music.resume();
    };
    v.addEventListener('pause', back);
    v.addEventListener('ended', back);
  });

  /* ---------------- MUSIC TOGGLE ---------------- */
  const soundBtn = $('#sound');
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    soundBtn.classList.toggle('off', muted);
    soundBtn.setAttribute('aria-label', muted ? 'Turn music on' : 'Turn music off');
    if (muted) music.pause();
    else if (!vids.some(x => !x.paused && !x.ended)) music.resume();
  });

  /* ---------------- FLOATING CAKES (a few, slow, soft) ---------------- */
  function makeCakes() {
    if (reduceMotion) return;
    const wrap = $('#cakes');
    const count = 8;
    for (let i = 0; i < count; i++) {
      const c = document.createElement('span');
      c.className = 'cake';
      c.textContent = '\uD83C\uDF82';
      const size = 20 + Math.random() * 14;
      const dur = 17 + Math.random() * 11;
      c.style.left = (4 + (i + Math.random() * 0.7) * (92 / count)) + '%';
      c.style.fontSize = size + 'px';
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = (-Math.random() * dur) + 's';
      c.style.setProperty('--sway', (Math.random() * 50 - 25) + 'px');
      wrap.appendChild(c);
    }
  }
})();
</script>
</body>
</html>
